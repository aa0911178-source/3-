<!DOCTYPE html> <html lang="ar" dir="rtl"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>نظام الإدارة</title> <style> *{ box-sizing:border-box; } body{ margin:0; font-family:Arial,sans-serif; background:#eef2f7; } /* الشاشات */ .screen{ display:none; min-height:100vh; padding:25px; } .active{ display:flex; justify-content:center; align-items:center; } /* الصندوق */ .box{ width:100%; max-width:430px; background:white; padding:35px 25px; border-radius:22px; box-shadow:0 8px 25px #0002; text-align:center; } h1{ font-size:32px; margin-bottom:15px; } p{ color:#64748b; font-size:17px; } /* الأزرار */ button{ width:100%; padding:15px; margin-top:15px; border:0; border-radius:12px; font-size:18px; color:white; cursor:pointer; } .btn-blue{ background:#2563eb; } .btn-green{ background:#16a34a; } .btn-purple{ background:#7c3aed; } .btn-gray{ background:#64748b; } .btn-red{ background:#dc2626; } /* المدير والليدر */ .panel{ width:100%; max-width:850px; } .header{ background:#2563eb; color:white; padding:25px; border-radius:20px; margin-bottom:20px; } .header h1{ margin:0; text-align:right; } .card{ background:white; padding:25px; border-radius:18px; margin-bottom:18px; box-shadow:0 4px 15px #0001; } .menu{ display:grid; grid-template-columns:1fr 1fr; gap:12px; } .menu button{ margin:0; } @media(max-width:500px){ .menu{ grid-template-columns:1fr; } } </style> </head> <body> <!-- ================================================= --> <!-- الشاشة الأولى : دخول --> <!-- ================================================= --> <section id="screen1" class="screen active"> <div class="box"> <h1>🔐 دخول</h1> <p> مرحباً بك في نظام الإدارة </p> <button class="btn-blue" onclick="goTo('screen2')"> دخول </button> </div> </section> <!-- ================================================= --> <!-- الشاشة الثانية : المدير --> <!-- ================================================= --> <section id="screen2" class="screen"> <div class="panel"> <div class="header"> <h1> 👨‍💼 شاشة المدير </h1> <p style="color:white"> لوحة تحكم المدير </p> </div> <div class="card"> <h2> إدارة النظام </h2> <div class="menu"> <button class="btn-blue" onclick="alert('إضافة موظف')"> ➕ إضافة موظف </button> <button class="btn-green" onclick="alert('عرض الموظفين')"> 📋 الموظفين </button> <button class="btn-purple" onclick="alert('التقارير')"> 📊 التقارير </button> <button class="btn-blue" onclick="alert('الإعدادات')"> ⚙️ الإعدادات </button> </div> </div> <button class="btn-green" onclick="goTo('screen3')"> التالي ➡️ </button> <button class="btn-gray" onclick="goTo('screen1')"> ⬅️ رجوع </button> </div> </section> <!-- ================================================= --> <!-- الشاشة الثالثة : الليدر --> <!-- ================================================= --> <section id="screen3" class="screen"> <div class="panel"> <div class="header" style="background:#16a34a"> <h1> 👨‍✈️ شاشة الليدر </h1> <p style="color:white"> لوحة متابعة الفريق </p> </div> <div class="card"> <h2> إدارة الفريق </h2> <div class="menu"> <button class="btn-green" onclick="alert('بيانات الفريق')"> 📋 بيانات الفريق </button> <button class="btn-blue" onclick="alert('تم تسجيل الحضور')"> ✅ تسجيل الحضور </button> <button class="btn-purple" onclick="alert('لا توجد إشعارات')"> 🔔 الإشعارات </button> <button class="btn-blue" onclick="alert('التقرير اليومي')"> 📊 التقرير اليومي </button> </div> </div> <button class="btn-gray" onclick="goTo('screen2')"> ⬅️ رجوع للمدير </button> <button class="btn-red" onclick="goTo('screen1')"> 🏠 الرئيسية </button> </div> </section> <script> /* تغيير الشاشات */ function goTo(screen){ document .querySelectorAll(".screen") .forEach(function(item){ item.classList.remove("active"); }); document .getElementById(screen) .classList.add("active"); } </script> </body> </html>
